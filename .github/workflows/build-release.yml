name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle \
            --target-platform android-arm,android-arm64 \
            --release
        env:
          # Firebase settings can be injected here
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: chesswardens-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios-release:
    name: Build iOS Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # NOTE: iOS signing requires:
      # 1. Apple Developer certificates (p12)
      # 2. Provisioning profiles (.mobileprovision)
      # 3. Export options plist
      # These should be stored as GitHub Secrets
      #
      # Setup example:
      # - Store certificates as base64 in APPLE_CERTIFICATE_P12 (base64 encoded)
      # - Store provisioning profiles in APPLE_PROVISIONING_PROFILE (base64 encoded)
      # - Store keychain password in APPLE_CERTIFICATE_PASSWORD
      #
      # Then decode and import in CI before building

      - name: Build iOS Release (unsigned - requires manual signing)
        run: |
          flutter build ios \
            --release \
            --no-codesign
        continue-on-error: true

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chesswardens-ios-unsigned
          path: build/ios/Release-iphoneos/
          retention-days: 30
        continue-on-error: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android-release, build-ios-release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            chesswardens-release.aab/app-release.aab,
            chesswardens-ios-unsigned/**
          tag: ${{ github.ref_name }}
          name: Chess Wardens ${{ github.ref_name }}
          draft: true
          prerelease: false
